services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctp
      POSTGRES_PASSWORD: ctp
      POSTGRES_DB: ctp_alpha
    ports: ["5432:5432"]
    volumes: [ctp_postgres:/var/lib/postgresql/data]
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [ctp_redis:/data]
volumes:
  ctp_postgres:
  ctp_redis: